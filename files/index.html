function gfBar(kind,rec){

  return`<div class="gf-bar">${rec.gfSent?`<span class="st done">RB formasına göndərilib: ${dmy(rec.gfSent)}</span>`:`<span class="st pend">RB formasına göndərilməyib</span>`}

function bindGf(kind,getRec,put,readCur){
  const root=$("#view");const msg=t=>{const e=root.querySelector("[data-gf-msg]");if(e){e.className="form-msg err";e.textContent=t}};
  root.querySelector("[data-gf-open]")?.addEventListener("click",()=>{const rec=getRec();if(!rec)return;
    const cur=readCur(),base=kind==="let"?{...rec,...letAuto(rec)}:kind==="aid"?{...rec,...aidAuto(rec)}:rec;if(Object.keys(cur).some(k=>String(cur[k]??"")!==String(base[k]??""))){msg("Əvvəlcə dəyişiklikləri «Yadda saxla» düyməsi ilə saxlayın, sonra formanı açın.");return}
    const r=GF_BUILD[kind](rec);if(r.miss.length){msg("RB forması üçün bunları doldurub yadda saxlayın: "+r.miss.join(", ")+".");return}
    gfOpenUrl(r.url);gfPend={kind,id:rec.id};render()});
  root.querySelector("[data-gf-yes]")?.addEventListener("click",async()=>{const rec=getRec();gfPend=null;
    if(rec){try{await put({...rec,gfSent:todayISO()});toast("RB formasına göndərildi kimi işarələndi")}catch(e){toast(errText(e))}}render()});
  root.querySelector("[data-gf-no]")?.addEventListener("click",()=>{gfPend=null;render()});

}

function readSd(){const fd=new FormData($("#sentry"));const g=k=>(fd.get(k)??"").toString().trim();

    town:g("town"),village:g("village"),address:g("address"),resp:g("resp"),note:g("note")}}

const inPeriod=o=>o.date>=form.start&&o.date<=form.end;
function compute(){
  const P=ops.filter(inPeriod);
  const fact={},people={},days={};
  for(const o of P){fact[o.code]=(fact[o.code]||0)+num(o.amount);people[o.code]=(people[o.code]||0)+num(o.people);days[o.code]=(days[o.code]||0)+num(o.days)}
  const AP=aid.filter(inPeriod);
  fact["2.4.1"]=(fact["2.4.1"]||0)+AP.reduce((a,x)=>a+num(x.amount),0);people["2.4.1"]=(people["2.4.1"]||0)+AP.length;
  for(const o of bk.filter(inPeriod)){const c=BK_MAIN(o.code);if(!c)continue;fact[c]=(fact[c]||0)+num(o.amount);people[c]=(people[c]||0)+num(o.people);days[c]=(days[c]||0)+num(o.days)}
  const b=form.bal,plan=form.plan;
  const C11=num(b.c12)+num(b.c13)+num(b.c14),D11=num(b.d12)+num(b.d13)+num(b.d14);
  const pv=c=>num(plan[c]),fv=c=>c==="1.9"?D11:num(fact[c]);
  const sumP=c=>isParent(c)?childrenOf(c).reduce((a,r)=>a+sumP(r.code),0):pv(c);
  const sumF=c=>isParent(c)?childrenOf(c).reduce((a,r)=>a+sumF(r.code),0):fv(c);
  const incCodes=ROWS.filter(r=>/^1\.\d+$/.test(r.code)).map(r=>r.code);
  const C27=incCodes.reduce((a,c)=>a+pv(c),0),D27=incCodes.reduce((a,c)=>a+fv(c),0);
  const C74=EXP_SECTIONS.reduce((a,r)=>a+sumP(r.code),0),D74=EXP_SECTIONS.reduce((a,r)=>a+sumF(r.code),0);
  return{P,AP,fact,people,days,C11,D11,pv,fv,sumP,sumF,C27,D27,C74,D74,C75:C11+C27-C74,D75:D27-D74};
}

function fitSheet(s){
  const box=document.createElement("div");box.className="fit-measure";
  box.style.cssText=`position:absolute;left:-20000px;top:0;width:${A4W}px;visibility:hidden`;
  const c=s.cloneNode(true);c.querySelectorAll(".print-btn").forEach(x=>x.remove());box.append(c);document.body.append(box);
  const h=c.scrollHeight;box.remove();
  const z=Math.min(1,A4H/h);
  s.style.setProperty("--pz",z.toFixed(4));s.style.setProperty("--pw",(A4W/z).toFixed(1)+"px");
}
function endPrint(){document.body.classList.remove("printing");document.querySelectorAll(".print-target").forEach(x=>x.classList.remove("print-target"));document.querySelectorAll(".print-head").forEach(x=>x.remove())}
function printSection(s){
  endPrint();
  if(!s.classList.contains("sheet")){
    const h=document.createElement("div");h.className="print-head";
    h.innerHTML=`<b>${esc(form.org||"")}</b>${form.org?"<br>":""}Dövr: ${dmy(form.start)} – ${dmy(form.end)} · Çap tarixi: ${dmy(new Date().toISOString().slice(0,10))}`;
    s.querySelector(":scope>h2")?.after(h)}
  if(s.classList.contains("sheet"))fitSheet(s);
  s.classList.add("print-target");document.body.classList.add("printing");
  const t=document.title,title=(s.dataset.ptitle||"Hesabat")+(form.org?" — "+form.org:"");document.title=title;
  if(window.api&&window.api.printPreview){
    window.api.printPreview(title).catch(()=>toast("Çap faylı hazırlanmadı")).finally(()=>{document.title=t;endPrint()});return}
  try{window.print()}finally{document.title=t}
}

async function delMem(id){licGuard();if(mode==="db")await db.collection("mem").doc(id).delete();else{mem=mem.filter(x=>x.id!==id);memVer++;lsSet();render()}}

/* Excel tarixi: rəqəm (Excel tarixi) və ya mətn (GG.AA.İİİİ; ay 12-dən böyükdürsə AA.GG.İİİİ kimi oxunur) */
function xlDate(v){
  if(v==null||v==="")return"";
  if(typeof v==="number"&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);if(d&&d.y)return`${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;return""}
  if(v instanceof Date&&!isNaN(v))return`${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}-${String(v.getDate()).padStart(2,"0")}`;
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=s.match(/^(\d{1,2})[.\/\-\s]+(\d{1,2})[.\/\-\s]+0?(\d{4})$/);if(!m)return"";
  let a=+m[1],b=+m[2],d,mo;if(a>12){d=a;mo=b}else if(b>12){mo=a;d=b}else{d=a;mo=b}
  if(mo<1||mo>12||d<1||d>31)return"";return`${m[3]}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
function readMembersFromSheet(rows){
  const hi=rows.findIndex(r=>r&&r.some(c=>/FİN|FIN/i.test(String(c||"")))&&r.some(c=>/Soyad/i.test(String(c||""))));
  if(hi<0)return null;
  const H=rows[hi].map(c=>String(c||"").toLocaleLowerCase("az"));
  const col=re=>H.findIndex(h=>re.test(h));
  const C={no:col(/^№|^n[oº]/),unit:col(/struktur|bölmə|iş yeri/),pos:col(/vəzifə/),name:col(/soyad/),fin:col(/fin/),birth:col(/təvəllüd|doğum/),edu:col(/təhsil/),hired:col(/təyinat|işə qəbul/),sst:H.findIndex(h=>/status/.test(h)&&!/üzvlük/.test(h))};
  const out=[];
  for(const r of rows.slice(hi+1)){if(!r)continue;const g=k=>C[k]>=0?r[C[k]]:"";const name=normName(g("name"));if(!name)continue;
    out.push({no:g("no")===""?"":Number(g("no"))||"",unit:normName(g("unit")),pos:normName(g("pos")),name,fin:normFin(g("fin")),birth:xlDate(g("birth")),edu:normName(g("edu")),hired:xlDate(g("hired")),sst:C.sst>=0?normName(g("sst")):""})}
  return out}
/* Uçot kartı siyahısını bütövlükdə dəyişmək (köhnəni silib yenisini yazmaq) */
async function setAllMembers(next,tag){
  if(mode==="db"){
    const keep=new Set(next.map(m=>m.id));
    for(const m of mem)if(!keep.has(m.id))await db.collection("mem").doc(m.id).delete();
    for(const m of next){const{id,...b}=m;await db.collection("mem").doc(id).set(b)}
  }else{if(window.api&&window.api.snapshot)window.api.snapshot(tag);mem=next;memVer++;lsSet()}
  mEdit=null;mConfirm=null;mDraft=null;mUnit="";
}
async function readMembersFile(file){
  if(!window.XLSX){toast("Excel kitabxanası yüklənmədi");return null}
  let rows;try{const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:false});
    for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""});const L=readMembersFromSheet(r);if(L&&L.length){rows=L;break}}}
  catch(e){toast("Excel faylı oxunmadı");return null}
  if(!rows){toast("Faylda «Soyadı, adı, ata adı» və «FİN» sütunları tapılmadı");return null}
  return rows}
/* Köhnə siyahını ləğv edib yeni Excel faylı ilə əvəz etmək */
async function replaceMembersFile(file){
  if(licBlocked()){toast(licMsg());return}
  const rows=await readMembersFile(file);if(!rows)return;
  const byKey=new Map(mem.map(m=>[memKey(m),m]));const now=new Date().toISOString();let same=0;
  const seen=new Set();const next=[];
  for(const r of rows){const k=memKey(r);if(seen.has(k))continue;seen.add(k);const ex=byKey.get(k);
    if(ex){next.push({...ex,...r,status:ex.status,exitDate:ex.exitDate,exitBasis:ex.exitBasis,note:ex.note,updatedAt:now});same++}
    else next.push({...r,id:newId(),status:"Üzv",exitDate:"",exitBasis:"",note:"",updatedAt:now})}
  const gone=mem.length-same;
  if(!confirm(`Köhnə siyahı ləğv olunacaq və yeni fayl ilə əvəz ediləcək.\n\nYeni faylda: ${next.length} nəfər\nKöhnə siyahıda olub yeni faylda olmayan (silinəcək): ${gone}\n\nHər iki faylda olan şəxslərin üzvlük statusu və xaric məlumatları saxlanılacaq.\nKöhnə məlumatların ehtiyat nüsxəsi avtomatik saxlanılır. Davam edilsin?`))return;
  await setAllMembers(next,"evez-oncesi");
  toast(`Siyahı yeniləndi: ${next.length} nəfər`);render()}
/* İdxal olunmuş siyahını tamamilə ləğv etmək */
async function clearMembers(){
  if(licBlocked()){toast(licMsg());return}
  if(!mem.length){toast("Siyahı onsuz da boşdur");return}
  if(!confirm(`Uçot kartındakı bütün ${mem.length} qeyd silinəcək.\nKöhnə məlumatların ehtiyat nüsxəsi avtomatik saxlanılır.\n\nDavam edilsin?`))return;
  await setAllMembers([],"temizleme-oncesi");
  toast("Siyahı təmizləndi. Yeni Excel faylını «Excel-dən idxal» ilə yükləyə bilərsiniz.");render()}
async function importMembersFile(file){
  const rows=await readMembersFile(file);if(!rows)return;
  const byKey=new Map(mem.map(m=>[memKey(m),m]));let add=0,upd=0;const now=new Date().toISOString();
  const next=mem.slice();
  for(const r of rows){const ex=byKey.get(memKey(r));
    if(ex){const i=next.indexOf(ex);next[i]={...ex,...r,status:ex.status,exitDate:ex.exitDate,exitBasis:ex.exitBasis,note:ex.note,updatedAt:now};upd++}
    else{const m={...r,id:newId(),status:"Üzv",exitDate:"",exitBasis:"",note:"",updatedAt:now};next.push(m);byKey.set(memKey(m),m);add++}}
  if(licBlocked()){toast(licMsg());return}
  if(!confirm(`Faylda ${rows.length} nəfər tapıldı.\nYeni əlavə olunacaq: ${add}\nYenilənəcək (artıq siyahıda olan): ${upd}\n\nÜzvlük statusu və xaric məlumatları dəyişdirilməyəcək. Davam edilsin?`))return;
  if(mode==="db"){for(const m of next){const{id,...b}=m;await db.collection("mem").doc(id).set(b)}}
  else{if(window.api&&window.api.snapshot)window.api.snapshot("idxal-oncesi");mem=next;memVer++;lsSet()}
  toast(`İdxal edildi: ${add} yeni, ${upd} yeniləndi`);render()}

  r:{org:"Mədəniyyət İşçiləri Həmkarlar İttifaqının Rəyasət Heyətinin",date:"«29» dekabr 2025-ci il tarixli",no:"«9» №-li qərarı ilə təsdiq edilmişdir",chair:"E.Ziyadov"}};
const bud=()=>{const x=form.budget||{};return{title:x.title??BUD_DEF.title,l:{...BUD_DEF.l,...(x.l||{})},r:{...BUD_DEF.r,...(x.r||{})}}};
/* «2026-cı», «2025-ci», «2023-cü», «2029-cu», «2030-cu», «2040-cı» */
function ilSuffix(y){const n=+y;if(!n)return"";
  const one={1:"ci",2:"ci",3:"cü",4:"cü",5:"ci",6:"cı",7:"ci",8:"ci",9:"cu"},ten={1:"cu",2:"ci",3:"cu",4:"cı",5:"ci",6:"cı",7:"ci",8:"ci",9:"cı"};
  const L=n%10,T=Math.floor(n/10)%10;return"-"+(L?one[L]:T?ten[T]:(Math.floor(n/100)%10?"cü":"ci"))}
const budYear=()=>(form.start||"").slice(0,4)||String(Y0);
const BUD_NAME={"2.6.1":"Dəftərxana və təsərrüfat mallarının alınması","2.6.2":"Əsas vəsaitlərin və qeyri maddi aktivlərin alınması"};
const budName=r=>BUD_NAME[r.code]||r.name;
const BUD_INC=()=>ROWS.filter(r=>/^1\.\d+$/.test(r.code));
/* Planın cəmləri (Excel-dəki düsturlar): ehtiyat fondu = (cəmi gəlirlər − 2.9) × 2% */
function budCalc(pv){
  const sumP=c=>isParent(c)?childrenOf(c).reduce((a,r)=>a+sumP(r.code),0):num(pv(c));
  const inc=BUD_INC().reduce((a,r)=>a+num(pv(r.code)),0);
  const exp=EXP_SECTIONS.reduce((a,r)=>a+sumP(r.code),0);
  const res=Math.round((inc-sumP("2.9"))*0.02*100)/100;
  return{sumP,inc,exp,res,bal:inc-exp-res}}

function readPlanInputs(){const p={};document.querySelectorAll("[data-plan]").forEach(i=>{if(i.value!=="")p[i.dataset.plan]=Number(i.value)});return p}
function readBudInputs(){const B=bud();document.querySelectorAll("[data-bud]").forEach(i=>{const[k,f]=i.dataset.bud.split(".");if(f)B[k][f]=i.value.trim();else B[k]=i.value.trim()});return B}
function planRecalc(){const p=readPlanInputs(),C=budCalc(c=>p[c]);
  document.querySelectorAll("[data-plan]").forEach(i=>{const s=i.nextElementSibling;if(s)s.textContent=moneyZ(p[i.dataset.plan])});
  document.querySelectorAll("[data-sum]").forEach(td=>td.textContent=money(C.sumP(td.dataset.sum)));
  $("#bInc").textContent=money(C.inc);$("#bExp").textContent=money(C.exp);$("#bRes").textContent=money(C.res);
  const b=$("#bBal");b.textContent=money(C.bal);b.classList.toggle("over",C.bal<0)}
/* Təsdiq olunmuş büdcə faylını oxumaq (Excel-dəki forma) */
function readBudgetSheet(rows){
  const ok=new Set(ROWS.filter(r=>!isParent(r.code)&&r.code!=="1"&&r.code!=="2").map(r=>r.code));
  const plan={};let found=0;const txt=[];
  for(const r of rows){if(!r)continue;const cells=r.map(c=>c==null?"":c);
    txt.push(...cells.filter(c=>typeof c==="string"&&c.trim()));
    const i=cells.findIndex(c=>ok.has(String(c).trim()));if(i<0)continue;
    const code=String(cells[i]).trim();found++;
    const v=cells.slice(i+1).find(c=>typeof c==="number"||(typeof c==="string"&&/^\s*-?[\d\s]+([.,]\d+)?\s*$/.test(c)));
    if(v!==undefined&&v!==""){const n=typeof v==="number"?v:Number(String(v).replace(/\s/g,"").replace(",","."));if(n)plan[code]=Math.round(n*100)/100}}
  if(found<5)return null;
  const B=bud(),all=txt.join("\n");
  const t=all.match(/(.*?)\s*\d{4}\s*-?\s*c\S*\s+il\s+üzrə\s+büdcəsi/i);if(t&&t[1].trim())B.title=normName(t[1]);
  const dates=[...all.matchAll(/["«“]\s*(\d{1,2})\s*["»”]\s+([^\s\d"«»]+)\s+(\d{4})\s*-?\s*c\S*\s+il\s+tarixli/g)];
  if(dates[0])B.l.date=`«${dates[0][1]}» ${dates[0][2]} ${dates[0][3]}${ilSuffix(dates[0][3])} il tarixli`;
  if(dates[1])B.r.date=`«${dates[1][1]}» ${dates[1][2]} ${dates[1][3]}${ilSuffix(dates[1][3])} il tarixli`;
  const nos=[...all.matchAll(/["«“]\s*(\d+)\s*["»”]\s*№\s*-?\s*li\s+qərarı/g)];
  if(nos[0])B.l.no=`«${nos[0][1]}» №-li qərarı ilə təsdiq edilmişdir`;if(nos[1])B.r.no=`«${nos[1][1]}» №-li qərarı ilə təsdiq edilmişdir`;
  const ch=[...all.matchAll(/Sədr\s*:\s*_*\s*([^_\n]+?)(?=\s{3,}|\s*$)/gm)].map(m=>normName(m[1])).filter(Boolean);
  if(ch[0])B.l.chair=ch[0];if(ch[1])B.r.chair=ch[1];
  return{plan,B}}
function exportBudgetXlsx(){
  if(!window.XLSX){toast("Excel kitabxanası yüklənmədi");return}
  const p=readPlanInputs(),B=readBudInputs(),C=budCalc(c=>p[c]),Y=budYear(),z=v=>num(v)||"";
  const A=[[B.l.org,"",B.r.org],[B.l.date,"",B.r.date],[B.l.no,"",B.r.no],[],[`Sədr: ____________ ${B.l.chair}`,"",`Sədr: ____________ ${B.r.chair}`],["M.Y.","","M.Y."],[],
    [`${B.title} ${Y}${ilSuffix(Y)} il üzrə büdcəsi`],[],
    ["Təsnifat kodu","Gəlirlərin mənbələri","Məbləğ (AZN)"],[1,"Gəlirlər"],...BUD_INC().map(r=>[r.code,r.name,z(p[r.code])]),["","Cəmi gəlirlər",C.inc],[],
    ["Təsnifat kodu","Xərclərin istiqamətləri","Məbləğ (AZN)"],[2,"Xərclər"]];
  for(const s of EXP_SECTIONS){const kids=childrenOf(s.code);A.push([s.code,s.name,kids.length?C.sumP(s.code):z(p[s.code])]);for(const k of kids)A.push([k.code,budName(k),z(p[k.code])])}
  A.push(["","Cəmi xərclər",C.exp],[],["","Ehtiyat fondu (2%)",C.res],[],["","Büdcə ili üzrə profisit (defisit)",C.bal]);
  const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(A);
  ws["!cols"]=[{wch:12},{wch:70},{wch:16}];ws["!merges"]=[{s:{r:7,c:0},e:{r:7,c:2}}];
  for(const k in ws){if(k[0]==="C"&&typeof ws[k].v==="number")ws[k].z="#,##0.00"}
  XLSX.utils.book_append_sheet(wb,ws,`${Y}-büdcə`);
  XLSX.writeFile(wb,`${Y}${ilSuffix(Y)} il üzrə büdcə.xlsx`)}
function bindPlan(){
  $("#view").querySelectorAll("[data-plan]").forEach(i=>i.addEventListener("input",planRecalc));
  $("#savePlan").addEventListener("click",async()=>{if(licBlocked()){toast(licMsg());return}
    form.plan=readPlanInputs();form.budget=readBudInputs();try{await putForm();toast("Plan yadda saxlandı")}catch(e){$("#pmsg").className="form-msg err";$("#pmsg").textContent=errText(e)}});
  $("#planExp").addEventListener("click",exportBudgetXlsx);
  $("#planImp").addEventListener("click",()=>$("#planFile").click());
  $("#planFile").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
    if(licBlocked()){toast(licMsg());return}if(!window.XLSX){toast("Excel kitabxanası yüklənmədi");return}
    let r=null;try{const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
      for(const n of wb.SheetNames){r=readBudgetSheet(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}));if(r)break}}catch(x){toast("Excel faylı oxunmadı");return}
    if(!r){toast("Faylda büdcə maddələri (1.1, 2.1.1 …) tapılmadı");return}
    const n=Object.keys(r.plan).length;
    if(!confirm(`Faylda ${n} maddə üzrə məbləğ tapıldı.\nHazırkı plan bu fayldakı məbləğlərlə əvəz olunacaq. Davam edilsin?`))return;
    form.plan=r.plan;form.budget=r.B;try{await putForm();toast("Büdcə Excel-dən yükləndi");render()}catch(x){toast(errText(x))}});
}

async function manualBackup(){const d=new Date().toISOString().slice(0,10);const r=await window.api.saveFile(`HI_ehtiyat_${d}.json`,new TextEncoder().encode(JSON.stringify({form,ops,aid,letters,bk,mem,sd},null,1)),"json");if(r)toast("Ehtiyat nüsxə saxlanıldı")}
const bkMsg=r=>!r?null:r.ok?`Ehtiyat nüsxə yazıldı: ${r.file}`:r.reason==="missing"?"Qovluq tapılmadı. Fləş-kartı taxın və yenidən cəhd edin.":r.reason==="nodata"?"Hələ saxlanılmış məlumat yoxdur.":"Ehtiyat nüsxə yazılmadı"+(r.msg?": "+r.msg:"");
function bindSettings(){bindLicCard();
  $("#saveSet").addEventListener("click",async()=>{if(licBlocked()){toast(licMsg());return}const v=id=>$("#"+id).value,nv=id=>Number(v(id))||0,m=$("#smsg");

    form={...form,org:v("s-org").trim(),chair:v("s-chair").trim(),start:v("s-start"),end:v("s-end"),
      gf:{kom:v("g-kom"),status:v("g-status"),iqt:v("g-iqt"),ray:v("g-ray"),resp:v("g-resp").trim(),pay:v("g-pay"),body:v("g-body")},
      rb:{c6:nv("rb-c6"),d6:nv("rb-d6"),c7:nv("rb-c7"),d7:nv("rb-d7")},

    try{await putForm();toast("Parametrlər yadda saxlandı");render()}catch(e){m.className="form-msg err";m.textContent=errText(e)}});
  $("#bkOut")?.addEventListener("click",manualBackup);
  $("#bkChoose")?.addEventListener("click",async()=>{const r=await window.api.chooseBackupDir();if(r){toast(bkMsg(r));render()}});
  $("#bkNow")?.addEventListener("click",async()=>{const r=await window.api.backupNow();toast(bkMsg(r));render()});
  $("#bkOpen")?.addEventListener("click",()=>window.api.openBackupDir());
  $("#bkClear")?.addEventListener("click",async()=>{if(!confirm("Avtomatik ehtiyat söndürülsün? Artıq yazılmış fayllar silinməyəcək."))return;await window.api.clearBackupDir();toast("Avtomatik ehtiyat söndürüldü");render()});
  $("#bkIn")?.addEventListener("click",async()=>{const t=await window.api.openFile();if(!t)return;let d;try{d=JSON.parse(t)}catch(e){toast("Fayl oxunmadı");return}
    if(!d||!Array.isArray(d.ops)){toast("Bu ehtiyat nüsxə faylı deyil");return}
    if(!confirm(`Hazırkı məlumatlar əvəz olunacaq (${d.ops.length} əməliyyat, ${(d.aid||[]).length} maddi yardım, ${(d.letters||[]).length} sənəd, ${(d.bk||[]).length} biznes kart, ${(d.mem||[]).length} üzv, ${(d.sd||[]).length} sosial dəstək). Davam edilsin?`))return;
    if(window.api.snapshot)window.api.snapshot("berpa-oncesi");
    form={...form,...d.form};ops=d.ops;aid=d.aid||[];letters=d.letters||[];bk=d.bk||[];mem=d.mem||[];sd=d.sd||[];memVer++;lsSet();toast("Məlumatlar bərpa edildi");render()});
  $("#bkDir")?.addEventListener("click",()=>window.api.openDir());
  $("#wbIn")?.addEventListener("click",()=>$("#wbFile").click());
  $("#wbFile")?.addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(x){toast("Fayl oxunmadı");return}applyBackup(d)});
  $("#wbOut")?.addEventListener("click",()=>{const d=new Date().toISOString().slice(0,10);const blob=new Blob([JSON.stringify({form,ops,aid,letters,bk,mem,sd},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`HI_ehtiyat_${d}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)})}
